<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hum</title>
    <!-- Font choices live in Settings → Appearance. JetBrains Mono is the
         local default; Inter, Lora + Newsreader load from Google Fonts for the
         Modern and Editorial presets. Preconnect shaves startup latency.
         media="print" + onload keeps the stylesheet off the critical path: a
         plain stylesheet link blocks first paint (and the app script) until
         Google answers, which on a slow or offline network stalls launch. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    >
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
